spring:
  application:
    name: alertabairro-api

  datasource:
    url: ${ORACLE_URL:jdbc:oracle:thin:@//localhost:1521/FREEPDB1}
    username: ${ORACLE_USER:alertabairro}
    password: ${ORACLE_PASSWORD:alertabairro_dev}
    hikari:
      pool-name: alertabairro-pool
      # Conexao Oracle e o recurso caro desta arquitetura. Pool com teto
      # explicito: sem limite, a API derruba o banco antes de si mesma.
      maximum-pool-size: ${POOL_MAX:10}
      minimum-idle: 2
      connection-timeout: 10000
      max-lifetime: 1800000

  flyway:
    enabled: true
    # Fonte unica das migracoes: os mesmos arquivos que rodam a mao no SQL
    # Developer. Nao ha copia em src/main/resources.
    locations: filesystem:${CAMINHO_MIGRACAO:./database/migrations}
    baseline-on-migrate: false

  jdbc:
    template:
      # Alinhado ao limite maximo de pagina (200): o cursor nao e materializado
      # inteiro na memoria da aplicacao.
      fetch-size: 200

  jackson:
    serialization:
      # Datas como texto ISO-8601 com offset, nunca como numero. O app joga
      # criadaEm direto em new Date(): sem offset, o "ha X min" mente.
      write-dates-as-timestamps: false
    default-property-inclusion: non_null

server:
  port: ${PORT:8080}
  error:
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: when-authorized

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method

alertabairro:
  # Limite de corpo da requisicao. Nenhuma propriedade do Boot cobre corpo
  # JSON (maxPostSize do Tomcat vale so para formulario), entao quem aplica
  # isto e o LimiteDeCorpoFilter.
  tamanho-maximo-corpo-bytes: 102400

logging:
  level:
    br.com.fiap.alertabairro: INFO
    org.springframework.jdbc.core: INFO
